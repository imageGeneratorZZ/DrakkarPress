<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Ebooks - DrakkarPress</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .catalog { max-width: 1200px; margin: 80px auto; padding: 0 20px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
    .card { background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.08); overflow:hidden; display:flex; flex-direction:column; }
    .cover { width: 100%; aspect-ratio: 3/4; object-fit: cover; background:#f2f2f2; }
    .body { padding: 16px; display:flex; flex-direction:column; gap: 10px; flex:1; }
    .title { font-weight: 700; font-size: 16px; line-height: 1.3; }
    .syn { color:#556; font-size: 13px; display:-webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow:hidden; }
    .meta { display:flex; justify-content:space-between; align-items:center; }
    .price { font-weight:800; color:#4F46E5; font-size: 18px; }
    .actions { display:flex; gap:8px; }
    .btn { border:none; background:#4F46E5; color:#fff; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600; }
    .btn.alt { background:#ddd; color:#222; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .search { width: 320px; max-width:100%; padding: 10px 12px; border:1px solid #ddd; border-radius:8px; }
    .frequency { display:flex; gap:8px; }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">DrakkarPress</a>
        <ul class="nav-menu">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="my-books.html" data-auth-required>Mi Biblioteca</a></li>
          <li><a href="premium.html">Premium</a></li>
          <li><a href="login.html" data-guest-only>Iniciar Sesión</a></li>
          <li><a href="register.html" data-guest-only>Registrarse</a></li>
          <li><span id="navUserInfo" style="display:none; color:#4F46E5; font-weight:600;"></span></li>
          <li><a href="#" id="navLogout" style="display:none;">Cerrar Sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="catalog">
    <div class="toolbar">
      <input id="q" class="search" placeholder="Buscar ebooks..." />
      <div class="frequency">
        <button class="btn alt" onclick="reload('date')">Más recientes</button>
        <button class="btn alt" onclick="reload('priceAsc')">Más baratos</button>
        <button class="btn alt" onclick="reload('priceDesc')">Más caros</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth-v2.js"></script>
  <script>
    const API_BASE_URL = window.DrakkarPress?.config?.getApiBaseUrl() || 'https://overflowing-consideration-production.up.railway.app';

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');

    async function fetchBooks(sort = 'date') {
      const url = `${API_BASE_URL}/api/public/books`;
      const res = await fetch(url);
      const json = await res.json();
      if (!json.success) return [];
      let books = json.data || [];
      const kw = (q.value || '').toLowerCase().trim();
      if (kw) books = books.filter(b => (b.title||'').toLowerCase().includes(kw) || (b.synopsis||'').toLowerCase().includes(kw));
      if (sort === 'priceAsc') books.sort((a,b)=> (a.priceDigital||0) - (b.priceDigital||0));
      if (sort === 'priceDesc') books.sort((a,b)=> (b.priceDigital||0) - (a.priceDigital||0));
      return books;
    }

    function priceFmt(n) { return n ? `$${Number(n).toFixed(2)}` : '—'; }

    function card(b) {
      const cover = b.coverImageUrl || 'assets/images/cover-placeholder.png';
      const price = priceFmt(b.priceDigital);
      return `
        <div class="card">
          <img class="cover" src="${cover}" alt="${b.title}" />
          <div class="body">
            <div class="title">${b.title}</div>
            <div class="syn">${b.synopsis || ''}</div>
            <div class="meta">
              <div class="price">${price}</div>
              <div class="actions">
                <button class="btn" onclick='buy("${b.id}","PDF")'>Comprar PDF</button>
                <button class="btn alt" onclick='buy("${b.id}","EPUB")'>EPUB</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    window.reload = async (sort) => {
      const books = await fetchBooks(sort);
      grid.innerHTML = books.map(card).join('');
    }

    window.buy = async (bookId, format) => {
      const token = localStorage.getItem('drakkarpress_token');
      if (!token) { window.location.href = `login.html?redirect=shop.html`; return; }
      try {
        const res = await fetch(`${API_BASE_URL}/api/books/purchase/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ bookId, format })
        });
        const json = await res.json();
        if (json.success && json.data && json.data.url) {
          window.location.href = json.data.url; // Stripe Checkout
        } else {
          alert(json.message || 'No se pudo iniciar el pago');
        }
      } catch (e) {
        console.error(e); alert('Error de red al iniciar compra');
      }
    }

    q.addEventListener('input', () => reload());
    reload();
  </script>
</body>
</html>
