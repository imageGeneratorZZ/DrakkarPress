<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Perfil - DrakkarPress</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
body {font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#FAFAFA; margin:0;}
.header {background:#fff;border-bottom:1px solid #ddd;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.header h1 {font-size:18px;margin:0;display:flex;align-items:center;gap:8px;}
.container {max-width:780px;margin:24px auto;padding:0 20px;}
.card {background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;margin-bottom:24px;}
.flex {display:flex;gap:24px;flex-wrap:wrap;}
.avatar {width:120px;height:120px;border-radius:50%;background:#1A4D7A;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;position:relative;overflow:hidden;}
.avatar img {width:100%;height:100%;object-fit:cover;}
.field {margin-bottom:16px;}
.field label {display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input, .field textarea {width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;background:#FAFAFA;}
.field textarea {min-height:120px;resize:vertical;}
.actions {display:flex;gap:12px;margin-top:8px;}
.btn {border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.btn-primary {background:#1A4D7A;color:#fff;}
.btn-secondary {background:#eee;color:#222;}
.badges {display:flex;gap:8px;flex-wrap:wrap;}
.badge {background:linear-gradient(135deg,#D4AF37,#FFD700);color:#222;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.meta {display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:12px;}
.meta-item {background:#F7F7F7;border:1px solid #e1e1e1;border-radius:10px;padding:12px;}
.meta-item span {display:block;font-size:12px;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.meta-item strong {font-size:14px;}
.notice {background:#E3F2FD;border-left:4px solid #2196F3;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.toast {position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #ddd;padding:14px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.3s;}
.toast.show {opacity:1;transform:translateY(0);}
.link-back {text-decoration:none;color:#1A4D7A;font-weight:600;font-size:13px;}
.readonly {background:#f0f0f0;}
</style>
</head>
<body>
<div class="header">
  <h1><i class="fas fa-user-circle"></i> Mi Perfil</h1>
  <a class="link-back" href="/index.html">← Volver</a>
</div>
<div class="container">
  <div id="toast" class="toast"><i class="fas fa-info-circle"></i><span id="toast-msg"></span></div>
  <div class="card" style="padding-bottom:0">
    <div class="flex" style="align-items:flex-start">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:120px;">
        <div class="avatar" id="avatar"><span id="avatar-initial">U</span></div>
        <div class="badges" id="stats" style="flex-direction:column;gap:4px;margin-top:0">
          <div class="badge">📚 <span id="stat-books">0</span> Libros</div>
          <div class="badge">👥 <span id="stat-followers">0</span> Seguidores</div>
          <div class="badge">🤝 <span id="stat-following">0</span> Siguiendo</div>
        </div>
      </div>
      <div style="flex:1;min-width:240px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <input id="username" class="readonly" readonly style="width:auto;min-width:120px;font-weight:700;font-size:18px;background:transparent;border:none;padding:0;margin:0 8px 0 0;" />
          <a id="external-link" href="#" target="_blank" style="color:#1A4D7A;font-size:15px;display:none"><i class="fas fa-link"></i> Enlace externo</a>
        </div>
        <div id="bio-compact" style="font-size:14px;color:#444;margin:8px 0 10px 0;white-space:pre-line"></div>
        <div class="actions" style="margin:8px 0 0 0;">
          <button class="btn btn-primary" id="btn-save"><i class="fas fa-save"></i> Guardar</button>
          <button class="btn btn-secondary" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:16px;margin:18px 0 0 0;align-items:center;">
      <div id="highlights" style="display:flex;gap:10px;align-items:center;"></div>
      <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;" id="btn-add-highlight"><i class="fas fa-plus"></i> Highlight</button>
    </div>
    <div style="margin:18px 0 0 0;">
      <div class="tabs" style="display:flex;gap:24px;border-bottom:1px solid #eee;">
        <button class="btn btn-secondary" style="background:none;border:none;font-size:15px;padding:8px 0;" id="tab-publicaciones">Publicaciones</button>
        <button class="btn btn-secondary" style="background:none;border:none;font-size:15px;padding:8px 0;" id="tab-series">Series</button>
        <button class="btn btn-secondary" style="background:none;border:none;font-size:15px;padding:8px 0;" id="tab-guardados">Guardados</button>
      </div>
    </div>
    <div class="meta" id="meta" style="margin-top:18px"></div>
  </div>
  <div class="card" style="padding-top:18px">
    <div id="tab-content-publicaciones">
      <div id="books-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px"></div>
    </div>
    <div id="tab-content-series" style="display:none;text-align:center;color:#888;padding:32px 0;">(Próximamente: series de libros)</div>
    <div id="tab-content-guardados" style="display:none;text-align:center;color:#888;padding:32px 0;">(Próximamente: guardados)</div>
  </div>
</div>
<script src="js/api-client.js"></script>
<script>
function showToast(msg,type){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast',3000);}
async function loadProfile(){if(!api.isAuthenticated()){location.href='/login.html';return;}const res=await api.getMyProfile();if(!res.success){showToast(res.message||'Error cargando perfil','error');return;}const d=res.data;document.getElementById('username').value=d.username||'';document.getElementById('fullName').value=d.fullName||'';document.getElementById('bio').value=d.bio||'';document.getElementById('profilePictureUrl').value=d.profilePictureUrl||'';document.getElementById('avatar-initial').textContent=(d.username||'U')[0].toUpperCase();if(d.profilePictureUrl){const img=document.createElement('img');img.src=d.profilePictureUrl;img.alt='avatar';const av=document.getElementById('avatar');av.innerHTML='';av.appendChild(img);}renderMeta(d);}function renderMeta(d){const meta=document.getElementById('meta');meta.innerHTML='';const items=[['Email',d.email],['Plan',d.plan],['Suscripción',d.subscription],['Premium',d.premium?'Sí':'No'],['Creado',d.createdAt?.toString()?.substring(0,19)],['Idioma',d.language],['País',d.country]];items.forEach(([k,v])=>{const div=document.createElement('div');div.className='meta-item';div.innerHTML='<span>'+k+'</span><strong>'+(v||'-')+'</strong>';meta.appendChild(div);});}

document.getElementById('btn-save').addEventListener('click',async()=>{const updates={fullName:document.getElementById('fullName').value.trim(),bio:document.getElementById('bio').value.trim(),profilePictureUrl:document.getElementById('profilePictureUrl').value.trim()};const res=await api.updateMyProfile(updates);if(res.success){showToast('Perfil actualizado');loadProfile();}else{showToast(res.message||'Error al guardar','error');}});

document.getElementById('btn-logout').addEventListener('click',()=>{api.logout();location.replace('/login.html');});

document.addEventListener('DOMContentLoaded',loadProfile);
function renderStats(d){
  document.getElementById('stat-books').textContent=d.booksCount??0;
  document.getElementById('stat-followers').textContent=d.followers??0;
  document.getElementById('stat-following').textContent=d.following??0;
  document.getElementById('bio-compact').textContent = d.bio || '';
  if(d.externalUrl){
    const ext = document.getElementById('external-link');
    ext.href = d.externalUrl;
    ext.style.display = '';
  }
}
async function loadMyBooks(){
  try{
    const res=await api.getMyBooks?.();
    const grid=document.getElementById('books-grid');
    grid.innerHTML='';
    const list=(res&&res.data)||[];
    if(!list.length){
      grid.innerHTML='<div style="color:#666">Aún no tienes publicaciones. Genera tu primer libro en el <a href="/generators.html">Generador</a>.</div>';
      return;
    }
    list.forEach(b=>{
      const card=document.createElement('div');
      card.style.background='#fff';
      card.style.border='1px solid #eee';
      card.style.borderRadius='12px';
      card.style.padding='0';
      card.style.overflow='hidden';
      card.style.cursor='pointer';
      card.innerHTML = `
        <div style="aspect-ratio:3/4;background:#eaeaea;display:flex;align-items:center;justify-content:center;">
          <img src="${b.coverUrl||''}" alt="cover" style="width:100%;height:100%;object-fit:cover;display:${b.coverUrl?'block':'none'}">
          <span style="color:#888;font-size:32px;font-weight:700;display:${b.coverUrl?'none':'block'}">${(b.title||'L')[0]}</span>
        </div>
        <div style="padding:8px 10px 10px 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title||'Libro'}</div>
      `;
      card.onclick=()=>{window.location.href='/generator-advanced.html?projectId='+(b.projectId||'');};
      grid.appendChild(card);
    });
  }catch(e){console.warn('No se pudo cargar libros',e);}
}
// Tabs logic
document.getElementById('tab-publicaciones').onclick = function(){
  document.getElementById('tab-content-publicaciones').style.display='block';
  document.getElementById('tab-content-series').style.display='none';
  document.getElementById('tab-content-guardados').style.display='none';
};
document.getElementById('tab-series').onclick = function(){
  document.getElementById('tab-content-publicaciones').style.display='none';
  document.getElementById('tab-content-series').style.display='block';
  document.getElementById('tab-content-guardados').style.display='none';
};
document.getElementById('tab-guardados').onclick = function(){
  document.getElementById('tab-content-publicaciones').style.display='none';
  document.getElementById('tab-content-series').style.display='none';
  document.getElementById('tab-content-guardados').style.display='block';
};
// Highlights placeholder
document.getElementById('btn-add-highlight').onclick = function(){
  const h = document.createElement('div');
  h.className = 'badge';
  h.textContent = 'Nuevo highlight';
  document.getElementById('highlights').appendChild(h);
};
// Render books on load
document.addEventListener('DOMContentLoaded',loadMyBooks);
</script>
</body>
</html>
