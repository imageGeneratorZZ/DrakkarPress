[build]
  publish = "."
  command = "echo 'DrakkarPress Instagram Edition deployed'"

# API proxy to backend (MUST be BEFORE catch-all SPA redirect)
[[redirects]]
  from = "/api/*"
  to = "https://overflowing-consideration-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA redirect for all routes (catch-all MUST be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
