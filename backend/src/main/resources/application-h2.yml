spring:
  datasource:
    url: jdbc:h2:mem:drakkar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Reducir logs en local
logging:
  level:
    root: INFO
    org.springframework: WARN
    com.drakkarpress: INFO

server:
  port: 8080
