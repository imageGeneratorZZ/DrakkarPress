# Perfil LOCAL - Sin OAuth2 y con esquema simplificado
spring.application.name=drakkarpress-platform-local
server.port=8080

# PostgreSQL local (usa el de Docker que ya tenemos corriendo en puerto 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/drakkarpress_db
spring.datasource.username=drakkarpress_user
spring.datasource.password=change_this_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=drakkarpress-local-secret-key-minimum-256-bits-required
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

# Logging
logging.level.root=INFO
logging.level.com.drakkarpress=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Disable mail
spring.mail.host=localhost
spring.mail.port=2525

# Disable OAuth2 (sin registrations)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Disable external services
lulu.client.key=dummy
lulu.client.secret=dummy
shopify.api.key=dummy
