# Test Profile - Sin OAuth2, solo autenticación JWT
spring.application.name=DrakkarPress Platform (TEST)

# IMPORTANTE: Mantener como aplicación WEB
spring.main.web-application-type=servlet
spring.main.keep-alive=true

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:drakkar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# HikariCP optimizado para H2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DrakkarPress-HikariCP

# DESACTIVAR OAuth2 COMPLETAMENTE
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# JWT Configuration
jwt.secret=your-secret-key-change-in-production-minimum-256-bits-required-for-HS256
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

# Server Configuration
server.port=12000
server.error.include-message=always
server.error.include-stacktrace=never

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5500
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# Email (dummy - no se enviarán emails reales)
spring.mail.host=smtp.dummy.com
spring.mail.port=587
spring.mail.username=dummy@dummy.com
spring.mail.password=dummypass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.root=INFO
logging.level.com.drakkarpress=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# Actuator (solo para dev)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
