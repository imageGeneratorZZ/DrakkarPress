spring.application.name=drakkarpress-platform-h2
server.port=8080

# In-memory H2 (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:drakkar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable mail to avoid connection attempts
spring.mail.host=localhost
spring.mail.port=2525

# Simplify logging
logging.level.root=INFO
logging.level.com.drakkarpress=DEBUG

# Dummy OAuth2 redirect kept
app.oauth2.post-login-redirect=http://localhost:3000/oauth2/callback
app.cookies.same-site=Lax

# Disable external services noise
lulu.client.key=
lulu.client.secret=
shopify.api.key=
shopify.api.secret=
shopify.access.token=
investigatron.api-key=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dummy OAuth2 clients to satisfy bean creation (no real flow)
spring.security.oauth2.client.registration.google.client-id=dummy-google-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.facebook.client-id=dummy-facebook-id
spring.security.oauth2.client.registration.facebook.client-secret=dummy-facebook-secret
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
