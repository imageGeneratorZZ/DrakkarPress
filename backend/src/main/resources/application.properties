# Spring Boot Application Configuration
spring.application.name=drakkarpress-platform

# Server Configuration
# Bind to Railway's provided PORT if available; fallback to 8080 (Docker default)
server.port=${PORT:8080}
# Remove explicit context-path (defaults to /)

# Database Configuration (PostgreSQL) - prefer DATABASE_* env (Railway) but keep fallback to legacy SPRING_DATASOURCE_*
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drakkarpress_db}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:drakkarpress_user}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:change_this_password_123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP optimized for Railway Hobby plan (8GB RAM, $5/month)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration (optimized for low memory)
# Use 'update' to auto-create/update schema on first deploys (Railway).
# For strict prod environments, override via env var: JPA_DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# SQL Scripts (ejecutar solo en primera instalación)
# Descomentar estas líneas para inicializar la base de datos
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:db/schema.sql
# spring.sql.init.data-locations=classpath:db/init-data.sql
# spring.sql.init.continue-on-error=false

# JWT Configuration
jwt.secret=${JWT_SECRET:drakkarpress-super-secret-key-minimum-256-bits-required-for-hs256-algorithm-change-in-production}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

# Logging Configuration (minimal for production)
logging.level.root=WARN
logging.level.com.drakkarpress=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.access.intercept=ERROR
logging.level.org.springframework.web=WARN

# CORS Configuration (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://drakkarpress.com,https://www.drakkarpress.com}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Configuration
app.name=DrakkarPress
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Lulu Print API (defaults allow service to start without secrets)
lulu.client.key=${LULU_CLIENT_KEY:}
lulu.client.secret=${LULU_CLIENT_SECRET:}
lulu.api.url=${LULU_API_URL:https://api.sandbox.lulu.com}
lulu.api.base64=${LULU_API_BASE64:Basic ZHVtbXkta2V5OmR1bW15LXNlY3JldA==}

# Shopify API defaults (prevent startup failure when secrets absent)
shopify.store.url=${SHOPIFY_STORE_URL:https://dummy-store.myshopify.com}
shopify.api.key=${SHOPIFY_API_KEY:dummy-api-key}
shopify.api.secret=${SHOPIFY_API_SECRET:dummy-api-secret}
shopify.access.token=${SHOPIFY_ACCESS_TOKEN:dummy-access-token}
shopify.webhook.secret=${SHOPIFY_WEBHOOK_SECRET:dummy-webhook-secret}

# Investigatron AI service defaults
api.investigatron.url=${INVESTIGATRON_API_URL:http://localhost:8000}
api.investigatron.api-key=${INVESTIGATRON_API_KEY:dummy-investigatron-key}

# OAuth2 Social Login (Google / Facebook)
# Redirect después de login exitoso (frontend receptor de tokens)
app.oauth2.post-login-redirect=${OAUTH2_REDIRECT_URL:https://drakkarpress.com/oauth2/callback}
app.cookies.same-site=${APP_COOKIES_SAME_SITE:Lax}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:dummy-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:dummy-facebook-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v13.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v13.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
