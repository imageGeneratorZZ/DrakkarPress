# Spring Boot Application Configuration
spring.application.name=drakkarpress-platform

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/drakkarpress_db
spring.datasource.username=drakkarpress_user
spring.datasource.password=change_this_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Scripts (ejecutar solo en primera instalación)
# Descomentar estas líneas para inicializar la base de datos
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:db/schema.sql
# spring.sql.init.data-locations=classpath:db/init-data.sql
# spring.sql.init.continue-on-error=false

# JWT Configuration
jwt.secret=drakkarpress-super-secret-key-minimum-256-bits-required-for-hs256-algorithm-change-in-production
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

# Logging Configuration
logging.level.root=INFO
logging.level.com.drakkarpress.platform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
cors.allowed-origins=http://localhost:3000,https://drakkarpress.com,https://www.drakkarpress.com

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Configuration
app.name=DrakkarPress
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
