<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0a0e27; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1f3a; border: 2px solid #ff6b00; border-radius: 10px; padding: 30px; }
        .header { text-align: center; color: #ff6b00; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .button { display: inline-block; background: linear-gradient(90deg, #ff6b00, #ffd700); color: #0a0e27; padding: 15px 30px; text-decoration: none; border-radius: 25px; font-weight: bold; margin: 20px 0; }
        .warning { background: rgba(255, 107, 0, 0.1); padding: 15px; border-left: 4px solid #ff6b00; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⚠️ Recordatorio de Renovación</div>
        
        <p>Hola <span th:text="${userName}">Usuario</span>,</p>
        
        <div class="warning">
            <strong>Tu membresía Premium expira en <span th:text="${daysUntilExpiration}">7</span> días.</strong>
        </div>
        
        <p>Para mantener el acceso a todas las funcionalidades Premium, renueva tu membresía antes de que expire.</p>
        
        <div style="text-align: center;">
            <a th:href="${frontendUrl} + '/membership'" class="button">Renovar Ahora</a>
        </div>
        
        <p style="font-size: 12px; color: #888; margin-top: 30px;">
            Este es un recordatorio automático de <span th:text="${appName}">DrakkarPress</span>.
        </p>
    </div>
</body>
</html>
