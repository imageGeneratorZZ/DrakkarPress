<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0a0e27; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1f3a; border: 2px solid #ffd700; border-radius: 10px; padding: 30px; }
        .header { text-align: center; color: #ffd700; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .button { display: inline-block; background: linear-gradient(90deg, #ffd700, #ff6b00); color: #0a0e27; padding: 15px 30px; text-decoration: none; border-radius: 25px; font-weight: bold; margin: 20px 0; }
        .warning { background: rgba(255, 215, 0, 0.1); padding: 15px; border-left: 4px solid #ffd700; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🔑 Restablecer Contraseña</div>
        
        <p>Hola <span th:text="${userName}">Usuario</span>,</p>
        
        <p>Recibimos una solicitud para restablecer tu contraseña de <span th:text="${appName}">DrakkarPress</span>.</p>
        
        <div style="text-align: center;">
            <a th:href="${resetUrl}" class="button">Restablecer Contraseña</a>
        </div>
        
        <div class="warning">
            <strong>⚠️ Seguridad:</strong> Si no solicitaste este cambio, ignora este email. Tu contraseña actual seguirá siendo válida.
        </div>
        
        <p style="font-size: 12px; color: #888; margin-top: 30px;">
            Este enlace expirará en 1 hora por seguridad.
        </p>
    </div>
</body>
</html>
