<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0a0e27; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1f3a; border: 2px solid #00d4ff; border-radius: 10px; padding: 30px; }
        .header { text-align: center; color: #00d4ff; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .button { display: inline-block; background: linear-gradient(90deg, #00d4ff, #00ff88); color: #0a0e27; padding: 15px 30px; text-decoration: none; border-radius: 25px; font-weight: bold; margin: 20px 0; }
        .code { background: rgba(0, 212, 255, 0.1); padding: 15px; border-radius: 5px; font-family: monospace; font-size: 16px; text-align: center; margin: 20px 0; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🔐 Verifica tu Email</div>
        
        <p>Hola <span th:text="${userName}">Usuario</span>,</p>
        
        <p>Gracias por registrarte en <span th:text="${appName}">DrakkarPress</span>. Para completar tu registro, por favor verifica tu dirección de email.</p>
        
        <div style="text-align: center;">
            <a th:href="${verificationUrl}" class="button">Verificar Email</a>
        </div>
        
        <p style="font-size: 12px; color: #888; margin-top: 30px;">
            Si no puedes hacer clic en el botón, copia y pega este enlace en tu navegador:<br>
            <span class="code" th:text="${verificationUrl}">http://...</span>
        </p>
        
        <p style="font-size: 12px; color: #888;">
            Este enlace expirará en 24 horas.
        </p>
    </div>
</body>
</html>
