version: '3.9'

services:
  db:
    image: postgres:15
    container_name: drakkarpress-db
    environment:
      POSTGRES_DB: drakkarpress
      POSTGRES_USER: drk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - drakkarpress-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drk_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: drakkarpress-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/drakkarpress
      SPRING_DATASOURCE_USERNAME: drk_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      LULU_CLIENT_KEY: ${LULU_CLIENT_KEY}
      LULU_CLIENT_SECRET: ${LULU_CLIENT_SECRET}
      LULU_API_BASE64: ${LULU_API_BASE64}
      LULU_API_URL: ${LULU_API_URL}
      FRONTEND_URL: https://drakkarpress.com
      CORS_ALLOWED_ORIGINS: https://drakkarpress.com,https://www.drakkarpress.com
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drakkarpress-net
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: drakkarpress-caddy
    environment:
      # Email for ACME/Let’s Encrypt registration (set via env)
      ACME_AGREE: true
      API_HOST: ${API_HOST:-api.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
    networks:
      - drakkarpress-net
    restart: unless-stopped

networks:
  drakkarpress-net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
