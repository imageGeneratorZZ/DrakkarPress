services:
  db:
    image: postgres:16-alpine
    container_name: drakkar_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]

  backend:
    build:
      context: ./backend
    container_name: drakkar_backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      APP_BASE_URL: https://${DOMAIN}
    networks: [backend]
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: drakkar_nginx
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/drakkarpress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [backend]

  certbot:
    image: certbot/certbot
    container_name: drakkar_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  db_data:

networks:
  backend:
    driver: bridge
